<div class="login-page">

  <div class="login-card">

    <!-- LOGO -->

    <div class="logo-container">

      <a routerLink="/" class="logo">
        ISOMIND
      </a>

    </div>


    <!-- TITULO -->

    <div class="login-header">

      <h1>
        Bienvenido
      </h1>

      <p>
        Ingresá a tu cuenta para continuar
      </p>

    </div>


    <!-- FORMULARIO -->

    <form (ngSubmit)="ingresar()">

      <!-- EMAIL -->

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input type="email"
               id="email"
               name="email"
               [(ngModel)]="email"
               placeholder="Ingresá tu email"
               autocomplete="email"
               required>

      </div>


      <!-- CONTRASEÑA -->

      <div class="form-group">

        <div class="password-header">

          <label for="password">
            Contraseña
          </label>

          <a href="#">
            ¿Olvidaste tu contraseña?
          </a>

        </div>


        <div class="password-container">

          <input [type]="mostrarPassword ? 'text' : 'password'"
                 id="password"
                 name="password"
                 [(ngModel)]="password"
                 placeholder="Ingresá tu contraseña"
                 autocomplete="current-password"
                 required>


          <button type="button"
                  class="show-password"
                  (click)="mostrarPassword = !mostrarPassword">

            {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}

          </button>

        </div>

      </div>


      <!-- RECORDAR -->

      <div class="remember">

        <label>

          <input type="checkbox"
                 name="recordarme"
                 [(ngModel)]="recordarme">

          <span>
            Recordarme
          </span>

        </label>

      </div>


      <!-- BOTON -->

      <button type="submit"
              class="login-button">

        Ingresar

      </button>

    </form>


    <!-- REGISTRO -->

    <div class="register">

      <span>
        ¿Todavía no tenés una cuenta?
      </span>

      <a routerLink="/registro">
        Registrate
      </a>

    </div>


    <!-- VOLVER -->

    <div class="back-home">

      <a routerLink="/">
        ← Volver al inicio
      </a>

    </div>

  </div>

</div>
