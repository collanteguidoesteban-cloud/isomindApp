<div class="registro-page">

  <div class="registro-card">

    <!-- LOGO -->

    <div class="logo-container">

      <a routerLink="/" class="logo">
        ISOMIND
      </a>

    </div>


    <!-- TITULO -->

    <div class="registro-header">

      <h1>
        Creá tu cuenta
      </h1>

      <p>
        Empezá a conocer mejor a tus clientes
      </p>

    </div>


    <!-- FORMULARIO -->

    <form (ngSubmit)="registrar()">

      <!-- NEGOCIO -->

      <div class="form-group">

        <label for="negocio">
          Nombre del negocio *
        </label>

        <input type="text"
               id="negocio"
               name="negocio"
               [(ngModel)]="negocio"
               placeholder="Ej: Mi Comercio"
               required>

      </div>


      <!-- CONTACTO -->

      <div class="form-group">

        <label for="contacto">
          Nombre de contacto *
        </label>

        <input type="text"
               id="contacto"
               name="contacto"
               [(ngModel)]="contacto"
               placeholder="Ej: Juan García"
               required>

      </div>


      <!-- TELEFONO -->

      <div class="form-group">

        <label for="telefono">
          Teléfono *
        </label>

        <input type="tel"
               id="telefono"
               name="telefono"
               [(ngModel)]="telefono"
               placeholder="Ej: 3815555555"
               required>

      </div>


      <!-- EMAIL -->

      <div class="form-group">

        <label for="email">
          Email *
        </label>

        <input type="email"
               id="email"
               name="email"
               [(ngModel)]="email"
               placeholder="tu@email.com"
               required>

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label for="password">
          Contraseña *
        </label>

        <div class="password-container">

          <input [type]="mostrarPassword ? 'text' : 'password'"
                 id="password"
                 name="password"
                 [(ngModel)]="password"
                 (input)="verificarPassword()"
                 placeholder="Mínimo 6 caracteres"
                 required>

          <button type="button"
                  class="show-password"
                  (click)="mostrarPassword = !mostrarPassword">

            {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}

          </button>

        </div>


        <!-- SEGURIDAD -->

        <div class="password-security">

          <div class="security-bar">

            <div class="security-progress"
                 [style.width.%]="seguridadPassword">
            </div>

          </div>

          <span>
            Seguridad: {{ textoSeguridad }}
          </span>

        </div>

      </div>


      <!-- TERMINOS -->

      <div class="terms">

        <label>

          <input type="checkbox"
                 name="aceptaTerminos"
                 [(ngModel)]="aceptaTerminos">

          <span>
            Acepto los términos y condiciones
          </span>

        </label>

      </div>


      <!-- BOTON -->

      <button type="submit"
              class="registro-button"
              [disabled]="!aceptaTerminos">

        Crear mi cuenta

      </button>

    </form>


    <!-- LOGIN -->

    <div class="login-link">

      <span>
        ¿Ya tenés una cuenta?
      </span>

      <a routerLink="/login">
        Ingresá
      </a>

    </div>


    <!-- VOLVER -->

    <div class="back-home">

      <a routerLink="/">
        ← Volver al inicio
      </a>

    </div>

  </div>

</div>
